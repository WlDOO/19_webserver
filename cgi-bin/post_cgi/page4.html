<!-- Page 2: POST Method -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Appeler CGI avec POST</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .button {
            padding: 10px 20px;
            color: white;
            background-color: #f44336;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #e03126;
        }
        input {
            margin: 10px 0;
            padding: 8px;
            width: 80%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Appeler le script CGI avec POST</h1>
        <form action="/cgi-bin/votre_script_cgi.py" method="POST">
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" required><br>

            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" name="prenom" required><br>

            <button type="submit" class="button">Envoyer avec POST</button>
        </form>
    </div>
</body>
</html>
