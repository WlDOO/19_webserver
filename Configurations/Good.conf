server {
	listen 		8001;
	host  127.0.0.1 ;
	server_name	test;
	error_page 404 errors/404.html;
	client_max_body_size 1024;
	index index.html;
	root ./;

	location post/ {
	autoindex on;
	allow_methods  GET POST DELETE;
	}

	location tmp/ {
	autoindex on;
	allow_methods  GET;
	}

	location loin/ {
	autoindex on;
	allow_methods POST GET;
	}

	location loin2/ {
	autoindex on;
	allow_methods GET;
	alias loin/;
	}

	location cgi-bin/ {
	allow_methods GET POST;
	cgi_path /usr/bin/python3;
	cgi_ext .py;
	}

}