<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de téléchargement de fichier texte</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 50%;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            font-size: 16px;
            margin-bottom: 10px;
            display: block;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        .message {
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Envoyer un fichier texte</h2>
        <form action="votre_script_serveur.php" method="POST" enctype="multipart/form-data">
            <label for="fileUpload">Sélectionnez un fichier texte à télécharger :</label>
            <input type="file" id="fileUpload" name="fileUpload" accept=".txt" required>
            
            <input type="submit" value="Télécharger le fichier">
        </form>
        
        <!-- Message après soumission (peut être généré dynamiquement côté serveur) -->
        <div class="message">
            <!-- Exemple de message -->
            <p>Une fois le fichier texte téléchargé, il sera affiché ici ou traité côté serveur.</p>
        </div>
    </div>
</body>
</html>
