<!DOCTYPE html>
<html>
<head>
    <title>Colorful Headers</title>
    <style>
        h1 {
            color: #FF5733;
            font-size: 36px;
        }
        h2 {
            color: #33A2FF;
            font-size: 28px;
        }
        h3 {
            color: #8E44AD;
            font-size: 22px;
        }
    </style>
</head>
<body>
    <h1>Hello, World!</h1>
    <h2>Discover the Wonders of Nature</h2>
    <h3>Explore, Learn, and Grow</h3>
</body>
</html>
