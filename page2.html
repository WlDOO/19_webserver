<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Recherche de Skin - League of Legends</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        input, button {
            padding: 10px;
            margin: 10px 0;
            width: 80%;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="index.html">Page 1</a>
        <a href="page2.html">Page 2</a>
        <a href="page3.html">Page 3</a>
    </div>
<div class="container">
    <h1>Recherche de Skin - League of Legends</h1>
    <form action="/recherche-skin" method="POST">
        <label for="champion">Nom du Champion :</label><br>
        <input type="text" id="champion" name="champion" placeholder="Ex : Ahri" required><br>

        <label for="skin">Nom du Skin :</label><br>
        <input type="text" id="skin" name="skin" placeholder="Ex : Star Guardian" required><br>

        <button type="submit">Rechercher</button>
    </form>
</div>

</body>
</html>
