<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Montagnes de Seoul</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .navbar {
            background-color: #333;
            overflow: hidden;
        }
        .navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
        .content {
            padding: 20px;
            margin-top: 20px;
            text-align: center;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Bukhansan(북한산), Le sommet des rêves</h1>
        <img src="https://i.pinimg.com/736x/69/c1/1c/69c11cbeed876507da5c0d88628058ca.jpg" alt="Belle image">
        <p>J'ai grimpé le sommet des rêves pour trouver un sens à ma vie. Je cherchais un objectif, une direction.</p>
        </p>Au sommet, ce n'est pas une réponse que j'ai trouvée, mais un regard.</p>
        </p>Ce jour-là, sans l'avoir prévu, j'ai trouvé l'amour de ma vie.</p>
    </div>

</body>
</html>
