server {
	listen 		8001;				o|
	host  127.0.0.1;				|
	server_name	test;				o
	error_page 404 error/404.html; |
	client_max_body_size 1024;		\
	root docs/fusion_web/;			o|
	index index.html;				|

	location tours/ {				o|
	root docs/fusion_web;			|
	autoindex on;
	allow_methods POST GET;	
	index index.html;				|
	alias  docs/fusion_web;			|
	return    abc/index1.html;		|
	}

	location /cgi-bin {				|
	root ./;						|
	cgi_path /usr/bin/python3 /bin/bash; |
	cgi_ext .py .js .sh;
	}
}