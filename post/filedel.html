<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer un Fichier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .navbar {
            background-color: #333;
            overflow: hidden;
        }
        .navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 68px); 
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .button {
            padding: 10px 20px;
            color: white;
            background-color: #f44336;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #e03126;
        }
        input {
            margin: 10px 0;
            padding: 8px;
            width: 80%;
        }
        #error {
            color: red;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="cgi-bin/get.html">Get cgi</a>
        <a href="index_post.html">Post file</a>
        <a href="filedel.html">Raf</a>
        <a href="cgi-bin/post.html">Post cgi</a>
    </div>

    <div class="content">
        <div class="container">
            <h1>Supprimer un Fichier</h1>
            <form id="delete">
                <label for="filename">Nom du fichier à supprimer:</label>
                <input type="text" id="filename" name="filename" required><br>

                <button type="submit" class="button">Supprimer</button>
                <p id="error"></p>
            </form>
        </div>
    </div>

    <script>
        let form = document.getElementById("delete");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            let filename = document.getElementById("filename").value;
            const resp = await fetch(`http://${window.location.host}/${filename}`, {
                method: "DELETE",
                body: new URLSearchParams({filename})
            })

            if (resp.ok) {
                window.location.href = `http://${window.location.host}/post/conf_del.html`;
            } else {
                let error = document.getElementById("error");
                error.innerText = `error: ${resp.status}`;
            }
        })
    </script>
</body>
</html>
